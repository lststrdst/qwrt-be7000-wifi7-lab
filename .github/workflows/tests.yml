name: NETSCOPE verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_public.py
      - run: lua5.1 tests/test_subscription.lua
      - run: find firmware -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
      - run: node --check firmware/packages/luci-app-netscope-setup/files/www/luci-static/netscope/setup.js
      - run: node --check firmware/packages/luci-theme-netscope/files/www/luci-static/netscope/netscope.js
      - run: node --check firmware/packages/luci-app-netscope/files/www/luci-static/resources/netscope/capture.js
      - run: python tools/build_overlay.py
      - run: python tools/verify_overlay.py
      - run: |
          sh -n firmware/overlay/install.sh
          sh -n firmware/packages/luci-app-netscope-setup/files/usr/libexec/netscope-vpn-profile
          sh -n firmware/packages/luci-app-netscope/files/usr/libexec/netscope-capture-supervise
          sh -n firmware/packages/luci-app-netscope/files/usr/libexec/netscope-docker
          sh -n firmware/packages/luci-app-netscope/files/etc/init.d/netscope-capture
          sh -n firmware/packages/luci-app-netscope/files/etc/init.d/netscope-docker
          sh -n tests/on-router/run-capture-tests.sh
          sh -n firmware/packages/netscope-wifi7-lab/files/usr/libexec/netscope-wifi7-lab
          sh -n tools/netscope-iot-monitor/netscope-iot-monitor.sh
          sh -n examples/l2tp/route-guard.sh
          sh -n examples/amneziawg/run-userspace.sh

  beta-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: model
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require matching beta version and reviewed release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          profile = json.loads(Path('firmware/profiles/xiaomi-be7000-qwrt.json').read_text())
          assert re.fullmatch(r'v\d+\.\d+\.\d+-beta\.\d+', tag)
          assert tag == 'v' + profile['project_version'] and profile['flashable'] is False
          assert Path('docs/releases/' + tag + '.md').is_file()
          PY
      - run: python tools/build_overlay.py && python tools/verify_overlay.py
      - name: Publish source-derived overlay as a prerelease, never a firmware image
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --prerelease \
            --title "NETSCOPE ${RELEASE_TAG#v} — installable overlay" \
            --notes-file "docs/releases/$RELEASE_TAG.md" \
            "dist/netscope-xiaomi-be7000-qwrt-r26.2.2-overlay-${RELEASE_TAG#v}.tar.gz" \
            "dist/netscope-xiaomi-be7000-qwrt-r26.2.2-overlay-${RELEASE_TAG#v}.tar.gz.sha256"
